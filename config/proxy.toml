# GVM proxy config for Daytona dev workspace.
# Development: permissive defaults with full logging.
# For production, see: https://github.com/skwuwu/Analemma-GVM/config/proxy.toml

[server]
listen = "0.0.0.0:8080"

[enforcement]
# Development: Delay unknown ops instead of Deny, for easier exploration
default_decision   = { type = "Delay", milliseconds = 100 }
ic1_async_ledger   = true
ic1_loss_threshold = 0.001

[enforcement.on_block]
deny                  = "halt"
require_approval      = "soft_pivot"
throttle              = "rollback"
infrastructure_failure = "halt"

[nats]
url          = "nats://localhost:4222"
stream       = "gvm-audit"
max_age_days = 2555

[redis]
url = "redis://localhost:6379"

[srr]
network_file  = "config/srr_network.toml"
semantic_file = "config/srr_semantic.toml"
hot_reload    = true

[policies]
directory  = "config/policies/"
hot_reload = true

[operations]
registry_file = "config/operation_registry.toml"

[secrets]
file    = "config/secrets.toml"
key_env = "GVM_SECRETS_KEY"

[wal]
# batch_window_ms amortizes fsync() across concurrent agents (group commit).
#   2  = default: captures co-arrivals within one scheduler tick → 10x TPS for multi-agent
#   0  = minimum latency: no wait, one fsync per event (recommended for single-agent)
batch_window_ms = 2
max_batch_size  = 64

[dev]
host_overrides = { "api.stripe.com" = "127.0.0.1:9090", "unknown-api.com" = "127.0.0.1:9090", "gmail.googleapis.com" = "127.0.0.1:9090" }
