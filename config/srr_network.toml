# SRR Network rules — Daytona demo workspace.
#
# Scenario 1 & 2 design:
#   GET  api.stripe.com/*            → Allow   (simulates VPC security group allowlist)
#   POST api.stripe.com/v1/transfers → Deny    (GVM catches what VPC can't)
#   POST api.stripe.com/v1/charges   → Allow   (legitimate payment reads)
#   Everything else                  → Default-to-Caution (Delay 100ms)

[[rules]]
id       = "allow-stripe-read"
priority = 100
method   = "GET"
pattern  = "api.stripe.com/{any}"
decision = { type = "Allow" }

[[rules]]
id       = "allow-stripe-charges"
priority = 110
method   = "POST"
pattern  = "api.stripe.com/v1/charges{any}"
decision = { type = "Allow" }

[[rules]]
id       = "deny-stripe-transfers"
priority = 200
method   = "POST"
pattern  = "api.stripe.com/v1/transfers{any}"
decision = { type = "Deny", reason = "Wire transfer blocked — requires manual approval" }

[[rules]]
id       = "deny-cloud-metadata"
priority = 1000
method   = "GET"
pattern  = "169.254.169.254/{any}"
decision = { type = "Deny", reason = "SSRF: cloud metadata endpoint blocked" }
