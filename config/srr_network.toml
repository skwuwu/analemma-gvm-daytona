# SRR Network rules — development workspace (permissive baseline).
# Block only known-dangerous targets; allow everything else.
# For production rules, see the core repo: config/srr_network.toml

[[rules]]
id          = "block-cloud-metadata"
priority    = 1000
description = "Block AWS/GCP/Azure metadata endpoints (SSRF prevention)"
host_pattern = "169.254.169.254"
decision    = { type = "Deny" }

[[rules]]
id          = "block-localhost-ssrf"
priority    = 999
description = "Block localhost as upstream target"
host_pattern = "localhost"
decision    = { type = "Deny" }
